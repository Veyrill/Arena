<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Arena – prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3ecdd;--card:#fffaf0;--tx:#2b2118;--mut:#7a6a58;--bd:#d4c3a3;--ac:#b5541c;--hp:#c0392b;--c0:#7a6a58;--c1:#2e8b3d;--c2:#2a6fd0;--c3:#9b3fd0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1812;--card:#2a231a;--tx:#f0e6d2;--mut:#a39880;--bd:#4a3e2c;--ac:#e8803c;--c0:#a39880;--c1:#5fcf70;--c2:#6aa5ff;--c3:#c685f5;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1d1812;--card:#2a231a;--tx:#f0e6d2;--mut:#a39880;--bd:#4a3e2c;--ac:#e8803c;--c0:#a39880;--c1:#5fcf70;--c2:#6aa5ff;--c3:#c685f5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 'Cascadia Mono','Cascadia Code',Consolas,'Courier New',monospace}
h1{font-size:16px;margin:0;color:var(--ac)}h2{font-size:12px;margin:0 0 6px;letter-spacing:.05em;color:var(--mut)}
#lvl { font-size: 1.2em; font-weight: 700; }
.wrap{max-width:1120px;margin:auto;padding:10px;display:grid;gap:10px;grid-template-columns:120px 270px 1fr;align-items:start;position:relative}
/* panel wyboru ryby: przyklejony z boku, na prawo od całego układu – nie przesuwa reszty menu */
#fish-side,#act-side{position:absolute;left:100%;top:10px;width:250px}
/* wybór aktu: karta dopasowana do zawartości (najmniejsza możliwa szerokość) */
#act-side{width:max-content;padding:8px}
/* QUESTY: panel po prawej (pod wyborem aktu, jeśli jest) */
#quest-side{position:absolute;left:100%;top:10px;width:270px;margin-left:10px}
.qrow{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
.qrow .qic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.qrow .qtx{flex:1;min-width:0;font-size:12px;line-height:1.35}
.qrow .qtx b{font-size:13px}
.qrow.active{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.qrow.done{opacity:.5}
.qrow.ready{border-color:#3fdc3f;box-shadow:inset 0 0 0 1px #3fdc3f}   /* cel questa osiągnięty – czeka na Complete */
.qrow button{font-size:11px;padding:3px 8px}
.qbar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:3px 0}.qbar i{display:block;height:100%;background:var(--ac)}
#act-side .fish-list{gap:6px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}#fish-side,#act-side,#quest-side{position:static;width:auto;margin-left:0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.nav{display:flex;flex-direction:column;gap:6px}.nav button{text-align:left;font-weight:700;letter-spacing:.04em}
.nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
/* czerwona kropka przy zakładce (np. Skills, gdy są skill pointy do wydania) – jak przy nowych przedmiotach */
.nav button{position:relative}.nav button.new::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e53935;box-shadow:0 0 5px 2px #e5393588;animation:newglow .9s infinite alternate;pointer-events:none}
@media(max-width:820px){.nav{flex-direction:row}.nav button{flex:1;text-align:center}}

.eq-pages{display:flex;gap:4px;align-items:center}
.eq-page-btn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:12px;cursor:pointer;padding:0;transition:.12s}
.eq-page-btn:hover:not(:disabled){border-color:var(--ac)}
.eq-page-btn:disabled{cursor:not-allowed}
.eq-page-btn.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 40%,transparent)}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:230px;margin:0 auto 8px}
.slot{aspect-ratio:1;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bd) 18%,transparent);transition:.12s}
.slot[draggable]{border-style:solid;cursor:pointer;background:var(--card)}
.ic{font-size:26px;line-height:1}.ph{aspect-ratio:1}.px{width:32px;height:32px;image-rendering:pixelated}.slot .px{width:48px;height:48px}.cell .px{width:40px;height:40px}.slot.tall .px{width:64px;height:64px;image-rendering:pixelated}.ib{padding:0 4px;font-size:12px;border-radius:6px;margin-left:4px}
.fpbox{display:flex;align-items:flex-start;justify-content:flex-start;padding:2px;font-weight:700;font-size:13px;color:var(--c2)}
.slot.tall{grid-row:span 2;aspect-ratio:auto}.slot.tall .ic{font-size:40px}
.slot.wide{grid-column:1/-1;aspect-ratio:auto;height:38px}
.slot.ok{border-color:var(--ac);border-style:solid;box-shadow:inset 0 0 0 2px var(--ac)}.slot.no{opacity:.35}.slot.over{background:var(--ac)}
.r0{border-color:var(--c0)}.r1{border-color:var(--c1)}.r2{border-color:var(--c2)}.r3{border-color:var(--c3)}.r4{border-color:#f2c200;box-shadow:0 0 8px #f2c20088}.r5{border-color:#e53935;box-shadow:0 0 8px #e5393588}
.t0{color:var(--c0)}.t1{color:var(--c1)}.t2{color:var(--c2)}.t3{color:var(--c3)}.t4{color:#f2c200}.t5{color:#e53935}
.xpbar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:0 0 6px;position:relative}
.xpbar.lvlup{box-shadow:0 0 8px 2px #8e44adaa}
.xpbar.lvlup::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:xpshine .9s ease-out}
@keyframes xpshine{to{left:110%}}.xpbar i{display:block;height:100%;width:0;background:#8e44ad;transition:width .4s}
.stats div{display:flex;justify-content:space-between;align-items:center;padding:1px 0;border-bottom:1px solid var(--bd);position:relative}
.lb{cursor:help;text-decoration:underline dotted var(--mut);text-underline-offset:3px}
.plusw{display:inline-flex;margin-left:8px}
.plusw:has(.plus:disabled){cursor:not-allowed}
.plus{width:22px;height:22px;padding:0;line-height:1;font-size:17px;font-weight:800;border-radius:6px;background:var(--ac);color:#fff;border:1px solid var(--ac);animation:pl 1.6s infinite}
.plus:disabled{background:var(--card);color:var(--mut);border:1px dashed var(--bd);animation:none;pointer-events:none}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
/* złoto i skill pointy: w karcie postaci, między ekwipunkiem a napisem Level / XP, po prawej; Skill Points w lewej kolumnie, Gold zawsze w prawej
   (te same szerokości kolumn co wcześniej w pasku na górze) */
.money{display:grid;grid-template-columns:repeat(2,minmax(64px,auto));justify-content:end;gap:6px;margin-top:8px}
.spbox{grid-row:1;grid-column:1;display:flex;justify-content:flex-end;padding:3px 8px;border:1px solid var(--c2);border-radius:8px;font-weight:700}.spbox b{color:var(--c2)}.spbox[hidden]{display:none}
.gold{grid-row:1;grid-column:2;display:flex;justify-content:flex-end;padding:3px 8px;border:1px solid #e69500;border-radius:8px;font-weight:700}.gold b{color:#e69500}
.tiles,.grid9{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.grid9{grid-template-columns:repeat(3,1fr);max-width:360px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center;min-height:84px;border-radius:10px}
.tile small{color:var(--mut)}.tile.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.tile.lock{border:1px dashed var(--bd);opacity:.45;background:transparent}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.fig{font-size:40px;line-height:1.1;transition:transform .15s;margin-bottom:5px}.fig.hit{transform:translateX(14px)}.fig.hit2{transform:translateX(-14px)}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.info{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--mut);margin:8px 0}.info b{color:var(--tx)}.info>div{flex:1 1 calc(50% - 6px)}.info>div>span{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd)}
/* łup z wyprawy nad przyciskiem Collect (po wygranej) */
/* bariera (Elemental Barrier): niebieska końcówka paska HP gracza, zaraz za czerwoną częścią */
#sh1{position:absolute;top:0;left:100%;width:0;height:100%;background:#3a8fd6;transition:left .3s,width .3s}
#loot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:0 0 8px}#loot[hidden]{display:none}
#loot .cell{width:56px;height:56px;flex:none}#loot small{color:var(--mut)}
/* nagroda nad łupem: +XP (fiolet jak pasek XP) i +złoto z monetą */
#loot .rw{flex-basis:100%;display:flex;justify-content:center;gap:16px;font-weight:700;font-size:15px}
/* Back w oknie walki (wyprawa): ten sam kolor co Fight! */
#fbackrow button{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
/* wynik walki w miejscu Back (po walce): Victory! zielone / Defeat czerwone; stała wysokość wiersza – okno nie skacze */
#fbackrow{min-height:32px}#fres{flex:1;text-align:center;font-size:20px;letter-spacing:.03em}   /* wynik na środku okna walki */
#go{display:block;width:auto;margin:20px auto 0;padding:6px 16px;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#log[hidden]{display:none}   /* log walki ukryty, dopóki gracz nie kliknie „Show battle log” */
#log{height:100px;overflow:auto;font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:5px;margin:8px 0}
#log p{margin:1px 0}.crit{color:var(--ac);font-weight:700}.miss{color:var(--mut)}
.cell{position:relative}.qty{position:absolute;right:3px;bottom:0;font-size:11px;font-weight:700;color:var(--tx);text-shadow:0 0 3px var(--card),0 0 3px var(--card)}
.cell.new{position:relative}
.cell.new::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e53935;box-shadow:0 0 5px 2px #e5393588;animation:newglow .9s infinite alternate;pointer-events:none}
@keyframes newglow{from{opacity:.55;box-shadow:0 0 3px 1px #e5393577}to{opacity:1;box-shadow:0 0 9px 4px #e53935aa}}
.px.rust{filter:sepia(.8) saturate(.6) brightness(.7)}
/* miecz w slocie broni ekwipunku: 64 px (siatka 32×32 → dokładnie ×2, ostre piksele) */
.slot[data-slot=weapon] img[src*="/weapon/"]{width:64px!important;height:64px!important;image-rendering:pixelated!important}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--card)}.cell .ic{font-size:32px}.cell.r0{border-color:var(--c0)}.cell.r1{border-color:var(--c1)}.cell.r2{border-color:var(--c2)}.cell.r3{border-color:var(--c3)}.cell.r4{border-color:#f2c200;box-shadow:0 0 8px #f2c20088}.cell.r5{border-color:#e53935;box-shadow:0 0 8px #e5393588}
#sellbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#tip{position:fixed;display:none;z-index:50;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:18px;line-height:1.35;max-width:315px;pointer-events:none;box-shadow:0 4px 14px #0006}
#tip b{display:block;font-size:19px}
#skillreset:disabled{pointer-events:none}#skillresetw:has(#skillreset:disabled){cursor:not-allowed}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:16px 12px}
.recipe{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:90px}
.ctabs{display:flex;gap:6px;margin-bottom:10px}.ctabs button{font-weight:700}.ctabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#devbtn{position:fixed;left:12px;bottom:12px;z-index:60;font-weight:700;font-size:12px;opacity:.85}
#devbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* WYBÓR RYBY (boczne menu łowienia) */
.fish-list{display:flex;flex-direction:column;gap:10px}
.fish-row{display:flex;align-items:center;gap:10px}
.fish-row .cell{width:54px;height:54px;flex:none}
.fish-row .cell.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),0 0 10px color-mix(in srgb,var(--ac) 60%,transparent)}
.fish-row .cell.lock{border-style:dashed;opacity:.5;cursor:not-allowed;background:transparent}
.fish-row small{color:var(--mut)}

#popup-container {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 100;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.popup-msg {
  background: color-mix(in srgb, var(--ac) 15%, var(--card));
  border: 2px solid var(--ac);
  border-radius: 10px;
  padding: 12px 16px;
  box-shadow: 0 4px 16px #0005;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  animation: fadeIn .3s ease-out;
}
.popup-msg button {
  background: var(--ac);
  color: #fff;
  border: none;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

/* DRZEWKO ULEPSZEŃ */
.upg-tree-container{position:relative;width:100%;height:380px;background:color-mix(in srgb,var(--bd) 10%,transparent);border-radius:10px;border:1px solid var(--bd);overflow:hidden;cursor:grab}
.upg-tree-container:active{cursor:grabbing}
.upg-tree-content{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:center center;transition:transform 0.05s ease-out}
.upg-svg-lines{position:absolute;top:0;left:0;width:100%;height:100%}
.upg-line{stroke:var(--bd);stroke-width:2.5}
.upg-node{position:absolute;width:48px;height:48px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid var(--bd);background:var(--card);box-shadow:0 2px 6px #0002;transition:transform .1s;cursor:pointer;user-select:none}
.upg-node:hover:not(.disabled):not(.bought){border-color:var(--ac);transform:translate(-50%,-50%) scale(1.1)}
.upg-node.disabled{opacity:.4;cursor:not-allowed;background:transparent;border-style:dashed}
.upg-node.bought{border-color:#f2c200;background:color-mix(in srgb,#f2c200 22%,var(--card));box-shadow:0 0 12px 3px #f2c200aa;cursor:default}
.upg-node.center-node{width:56px;height:56px}
.upg-node .ic{font-size:24px;line-height:1}
.upg-node.small{width:24px;height:24px;border-radius:6px}.upg-node.small .ic{font-size:12px}
.upg-node.avail{border-color:var(--ac);box-shadow:0 0 9px color-mix(in srgb,var(--ac) 55%,transparent)}
.upg-line.on{stroke:#f2c200;filter:drop-shadow(0 0 3px #f2c200)}.upg-line.off{stroke-dasharray:4 5;opacity:.75}
.upg-badge{position:absolute;bottom:-4px;right:-4px;background:var(--ac);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:6px;border:1px solid var(--card)}
.upg-node.bought .upg-badge{background:#f2c200;color:#2b2118}
.tile.boss{border-color:#e0524a;box-shadow:0 0 10px 2px color-mix(in srgb,#e0524a 45%,transparent)}.fig.boss{filter:drop-shadow(0 0 7px #e0524a)}
</style></head><body>
<div id="popup-container"></div>
<button id="devbtn" title="Toggles developer mode and restarts the game">🛠️ DEV</button>
<div class="wrap">
<div class="nav" id="nav"></div>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h1>⚔️ Arena</h1>
    <div class="eq-pages">
      <button class="eq-page-btn on" onclick="setEquipPage(1)">1</button>
      <button class="eq-page-btn" onclick="setEquipPage(2)">2</button>
    </div>
  </div>
  <div class="slots" id="slots"></div>
  <div id="buffs-container" style="margin-top:8px"></div>
  <div class="money"><div class="gold" id="gold"></div><div class="spbox" id="sp" hidden></div></div>
  <div id="lvl" style="margin-top:6px"></div>
  <div class="xpbar"><i id="xpf"></i></div>
  <div class="stats" id="stats"></div>
</div>
<div>
<div class="card" id="v-exp"><h2>Expedition</h2><div id="body-exp"></div></div>
<div class="card" id="v-shop" hidden><h2>Shop</h2><div id="body-shop"></div></div>
<div class="card" id="v-upg" hidden><span id="skillresetw" style="position:absolute;top:6px;right:8px;display:inline-flex"><button id="skillreset" style="font-size:22px;line-height:1;padding:2px 8px;font-weight:700">↺</button></span><h2>Skills</h2><small style="color:var(--mut)">Mouse wheel: zoom · drag: pan the board</small><div id="body-upg" style="margin-top:6px"></div></div>
<div class="card" id="v-dun" hidden><h2>Dungeons</h2><div id="body-dun"></div></div>
<div class="card" id="v-craft" hidden><h2>Crafting</h2><div id="body-craft"></div></div>
<div class="card" id="v-fish" hidden><h2>Fishing</h2><div id="body-fish"></div></div>
<div class="card" id="v-upgrade" hidden><h2>Rod Upgrade</h2><div id="body-upgrade"></div></div>
<div class="card" id="v-cook" hidden><h2 style="display:flex;align-items:center;gap:10px">Cooking<span id="cook-head" style="flex:1;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0"></span></h2><div id="body-cook"></div></div>
<div class="card" id="fightbox" hidden>
<div class="row" id="fbackrow" style="display:none"><button data-a="fback">← Back</button><b id="fres"></b></div>
<div class="arena"><div><div class="fig" id="fp">🧙</div><b>You</b><div class="bar" style="position:relative"><i id="hp1" style="width:100%"></i><i id="sh1"></i></div><small id="ht1"></small></div>
<div style="font-size:18px">VS</div>
<div style="position:relative"><div class="fig" id="fm"></div><b id="nm"></b><div class="bar"><i id="hp2" style="width:100%"></i></div><small id="ht2"></small><div id="logwrap" style="position:absolute;right:0;top:100%;margin-top:24px"><button id="logbtn" style="font-size:12px;padding:3px 10px">Show battle log</button></div></div></div>
<div class="info" id="info"></div>
<div id="loot" hidden></div><button id="go">Fight!</button><div id="log" hidden></div></div>
<div class="card" id="invcard"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Backpack</h2><button id="sellbtn" title="Sell mode: click an item or drop it on this button">💰 Sell</button></div><div class="inv" id="inv"></div></div>
</div>
<div class="card" id="fish-side" hidden><h2>Fish selection</h2><div id="body-fish-side"></div></div>
<div class="card" id="act-side" hidden><h2>Act selection</h2><div id="body-act-side"></div></div>
<div class="card" id="quest-side" hidden><h2 style="display:flex;justify-content:space-between;align-items:center;gap:10px">Quests<span data-questcd style="font-size:13px;color:var(--mut);letter-spacing:0;text-transform:none"></span></h2><div id="body-quest-side"></div></div>
</div>
<script type="module">
  // Szuka ui.js obok index.html oraz w typowych podfolderach i podaje w konsoli, co znalazł.
  const candidates = ['./ui.js', './js/ui.js', './src/ui.js', './scripts/ui.js', './javascript/ui.js'];
  let found = null;
  for (const p of candidates) {
    try { const r = await fetch(p, { method: 'HEAD' }); if (r.ok) { found = p; break; } } catch (e) { /* próbuj dalej */ }
  }
  if (!found) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="padding:12px;background:#e53935;color:#fff;font:14px monospace">ui.js not found (checked: ' + candidates.join(', ') + '). Set the path in index.html.</div>');
    console.error('ui.js not found in:', candidates);
  } else {
    console.log('Loading game from', found);
    await import(found);
  }
</script></body></html>
