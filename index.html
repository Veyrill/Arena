<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Arena – prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3ecdd;--card:#fffaf0;--tx:#2b2118;--mut:#7a6a58;--bd:#d4c3a3;--ac:#b5541c;--on-ac:#fff;--hp:#c0392b;--c0:#7a6a58;--c1:#2e8b3d;--c2:#2a6fd0;--c3:#9b3fd0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1812;--card:#2a231a;--tx:#f0e6d2;--mut:#a39880;--bd:#4a3e2c;--ac:#e8803c;--on-ac:#1d1208;--c0:#a39880;--c1:#5fcf70;--c2:#6aa5ff;--c3:#c685f5;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1d1812;--card:#2a231a;--tx:#f0e6d2;--mut:#a39880;--bd:#4a3e2c;--ac:#e8803c;--on-ac:#1d1208;--c0:#a39880;--c1:#5fcf70;--c2:#6aa5ff;--c3:#c685f5;color-scheme:dark}
*{box-sizing:border-box}
/* KURSOR GRY: stalowa rękawica (assets/ui/cursor.png, 32×32), punkt kliknięcia = czubek palca (5, 4); brak pliku → zwykła strzałka.
   Wersje (32×32, przezroczyste tło): cursor_hover.png – wszystko klikalne (punkt 6, 4); cursor_grab.png – przedmioty i rzeczy do przeciągnięcia,
   plansza Passives (środek dłoni 16, 16); cursor_grabbing.png – wciśnięty przycisk myszy na tych elementach (17, 16).
   cursor_help.png – elementy z dymkiem (punkt = niebieski kamień 6, 6); cursor_no.png – nieaktywne przyciski i zablokowane elementy (5, 4).
   Kolejność reguł: późniejsza wygrywa (np. przycisk z dymkiem = hover, nieaktywny przycisk = no); :not(#_) podbija ważność reguł grab / przeciągania
   (przedmiot w plecaku = grab, nie hover). !important – wygrywa ze stylami w kodzie. */
html,body{cursor:url(assets/ui/cursor.png) 5 4,auto}
[style*="cursor:default"],.hpw,#portrait{cursor:url(assets/ui/cursor.png) 5 4,default!important}
:is([data-tip],.lb,[style*="cursor:help"],[style*="cursor: help"],.abtile,.mbq){cursor:url(assets/ui/cursor_help.png) 6 6,help!important}
:is(button:not(:disabled),a,[onclick],[data-a],[style*="cursor:pointer"],[style*="cursor: pointer"],.tile:not(:disabled),.upg-node:not(.disabled):not(.bought),.sk.ab,.sk.atk,.bpc,.absub,.eq-page-btn,.cell,.drow:not(.lck),.bppl span,.bpck,.bpck input,.qreset,.abmcancel,.bpoff,.bpreset,#xp-side .xpup){cursor:url(assets/ui/cursor_hover.png) 6 4,pointer!important}
:is([draggable=true],.slot[draggable],.upg-tree-container):not(#_){cursor:url(assets/ui/cursor_grab.png) 16 16,grab!important}
:is([draggable=true],.slot[draggable],.upg-tree-container):active:not(#_){cursor:url(assets/ui/cursor_grabbing.png) 17 16,grabbing!important}
body.dragging:not(#_),body.dragging *:not(#_):not(#__){cursor:url(assets/ui/cursor_grabbing.png) 17 16,grabbing!important;user-select:none}   /* w trakcie przeciągania (własne, nie natywne) – wszędzie zaciśnięta rękawica */
:is(.upg-node.bought,.sk.ab.off,.bpc.atk,.skillbar.fighting .sk.atk:not(.ready)){cursor:url(assets/ui/cursor.png) 5 4,default!important}
:is(button:disabled,.tile:disabled,.upg-node.disabled,.cell.lock,[style*="cursor:not-allowed"],[style*="cursor: not-allowed"],.plusw:has(.plus:disabled)){cursor:url(assets/ui/cursor_no.png) 5 4,not-allowed!important}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 'Cascadia Mono','Cascadia Code',Consolas,'Courier New',monospace}
h1{font-size:16px;margin:0;color:var(--ac)}h2{font-size:12px;margin:0 0 6px;letter-spacing:.05em;color:var(--mut)}
#lvl { font-size: 1.2em; font-weight: 700; }
.wrap{max-width:1120px;margin:auto;padding:10px;display:grid;gap:10px;grid-template-columns:120px 270px 1fr;align-items:start;position:relative}
/* panel wyboru ryby: przyklejony z boku, na prawo od całego układu – nie przesuwa reszty menu */
#fish-side,#act-side{position:absolute;left:100%;top:10px;width:250px}
/* PANEL DPS (w trakcie walki, w prawym dolnym rogu ekranu; wybór aktu wtedy schowany): źródła obrażeń – ikona, pasek, na turę (suma), udział % */
#dps-side{position:fixed;right:16px;bottom:16px;top:auto;z-index:50;width:max-content;padding:8px 10px;margin:0;box-shadow:0 4px 14px #0002}#dps-side .dpst{width:330px;font-size:13px}
/* wybór aktu: karta dopasowana do zawartości (najmniejsza możliwa szerokość) */
#act-side{width:max-content;padding:8px}
/* QUESTY: panel po prawej (pod wyborem aktu, jeśli jest) */
#quest-side{position:absolute;left:100%;top:10px;width:270px;margin-left:10px}
.qrow{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
.qrow .qic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.qrow .qtx{flex:1;min-width:0;font-size:12px;line-height:1.35}
.qrow .qtx b{font-size:13px}
.qrow.active{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.qrow button{font-size:11px;padding:3px 8px}
.qrow.qdone{border-color:#f2c200;box-shadow:inset 0 0 0 1px #f2c20066}.qrow.qdone .qbar i{background:#f2c200}
body .qrow .qcol{display:block;margin:6px auto 0;font-size:11px;padding:3px 10px 5px}   /* quest ukończony: złota ramka, przycisk Collect (Upgrade Token do plecaka) */
.qreset{width:18px;height:18px;padding:0;margin:0;border-width:1px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer}
.qreset:hover img{filter:brightness(1.25)}   /* Questy: po upływie czasu – przycisk z ikoną okrągłej strzałki (nowa pula) */
.qreset img{width:16px;height:16px;image-rendering:pixelated}   /* 16 px – przycisk mieści się w wysokości nagłówka (okno się nie rozszerza) */
/* Questy: wszystkie zrobione – lekko wyszarzone okienko z samym przyciskiem Reroll (aktywny po upływie czasu) */
.qempty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:1px dashed var(--bd);border-radius:8px;opacity:.75;text-align:center}.qempty small{color:var(--mut)}
.qreroll{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px}.qreroll img{width:16px;height:16px;image-rendering:pixelated}.qreroll:disabled img{filter:grayscale(1)}
/* ARTIFACTS: 5 kafelków ulepszeń za Upgrade Token w jednym rzędzie (ikony assets/ui/tup_*.png) */
.tuptok{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:-26px 0 12px;font-size:13px;color:var(--mut)}.tuptok b{font-size:15px;color:var(--tx)}
.tuprow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tupc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:2px solid var(--bd);border-radius:10px;text-align:center}
.tupc.max{border-color:#f2c200}
.tupico{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bd);border-radius:8px;background:color-mix(in srgb,var(--bd) 18%,transparent)}
.tupico img{display:block;width:64px;height:64px;image-rendering:pixelated}   /* ikona 32×32 ×2 */
.tupn{font-size:12px;line-height:1.25;min-height:2.5em;display:flex;align-items:center}
.tupl{font-size:12px;font-weight:800;color:var(--ac)}
.tupd{font-size:11px;color:var(--mut);min-height:2.6em}
.tupe{font-size:13px;font-weight:800;white-space:nowrap}.tupe span{color:var(--mut);font-weight:400}.tupe em{font-style:normal;color:#2e8b3d}
.tupbtn{width:100%;margin-top:auto;padding:4px 0 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px}.tupbtn img{display:block}   /* koszt: liczba + ikona Upgrade Token (24 px) */
.tupbtn:disabled img{filter:grayscale(1) brightness(.85)}
.qbar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:3px 0}.qbar i{display:block;height:100%;background:var(--ac)}
#act-side .fish-list{gap:6px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}#fish-side,#act-side,#dps-side,#quest-side{position:static;width:auto;margin-left:0}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;position:relative}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.nav{display:flex;flex-direction:column;gap:6px}
#nav button[hidden]{display:none}
/* PORTRET postaci nad zakładkami */
#portrait{position:relative;align-self:center;width:96px;height:96px;margin:2px 0 0;cursor:default}
#ptname{align-self:center;max-width:100%;margin:2px 0 10px;min-height:18px;font-size:14px;font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#portrait .pt-face{width:100%;height:100%;border-radius:50%;background-color:#3a3027;background-repeat:no-repeat;background-size:128px 128px;background-position:-20px 8px;image-rendering:pixelated;border:3px solid #111;box-shadow:0 0 0 2px #6b4a2b,inset 0 0 12px #0008;box-sizing:border-box}
#portrait .pt-lv{position:absolute;right:-4px;bottom:-2px;min-width:30px;height:30px;padding:0 5px;box-sizing:border-box;border-radius:15px;background:var(--ac);color:var(--on-ac);border:3px solid #111;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
@media(max-width:820px){#portrait,#ptname{display:none}}.nav button{text-align:left;font-weight:700;letter-spacing:.04em}
.nav button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
/* czerwona kropka przy zakładce (np. Skills, gdy są skill pointy do wydania) – jak przy nowych przedmiotach */
.nav button{position:relative}.nav button.new::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e53935;box-shadow:0 0 5px 2px #e5393588;animation:newglow .9s infinite alternate;pointer-events:none}
@media(max-width:820px){.nav{flex-direction:row}.nav button{flex:1;text-align:center}}

.eq-pages{display:flex;gap:4px;align-items:center}
.eq-page-btn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:12px;cursor:pointer;padding:0;transition:.12s}
.eq-page-btn:hover:not(:disabled){border-color:var(--ac)}
.eq-page-btn:disabled{cursor:not-allowed}
.eq-page-btn.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 40%,transparent)}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:230px;margin:0 auto 8px}
.slot{aspect-ratio:1;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bd) 18%,transparent);transition:.12s}
.slot[draggable]{border-style:solid;cursor:pointer;background:var(--card)}
.ic{font-size:26px;line-height:1}.ph{aspect-ratio:1}.px{width:32px;height:32px;image-rendering:pixelated}.slot .px{width:48px;height:48px}.cell .px{width:40px;height:40px}.slot.tall .px{width:64px;height:64px;image-rendering:pixelated}.ib{padding:0 4px;font-size:12px;border-radius:6px;margin-left:4px}
.fpbox{display:flex;align-items:flex-start;justify-content:flex-start;padding:2px;font-weight:700;font-size:13px;color:var(--c2)}
.slot.tall{grid-row:span 2;aspect-ratio:auto}.slot.tall .ic{font-size:40px}
.slot.wide{grid-column:1/-1;aspect-ratio:auto;height:38px}
.slot.ok{border-color:var(--ac);border-style:solid;box-shadow:inset 0 0 0 2px var(--ac)}.slot.no{opacity:.35}.slot.over{background:var(--ac)}
.r0{border-color:var(--c0)}.r1{border-color:var(--c1)}.r2{border-color:var(--c2)}.r3{border-color:var(--c3)}.r4{border-color:#f2c200;box-shadow:0 0 8px #f2c20088}.r5{border-color:#e53935;box-shadow:0 0 8px #e5393588}
.t0{color:var(--c0)}.t1{color:var(--c1)}.t2{color:var(--c2)}.t3{color:var(--c3)}.t4{color:#f2c200}.t5{color:#e53935}
.xpbar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:0 0 6px;position:relative}
.xpbar.lvlup{box-shadow:0 0 8px 2px #8e44adaa}
.xpbar.lvlup::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:xpshine .9s ease-out}
@keyframes xpshine{to{left:110%}}.xpbar i{display:block;height:100%;width:0;background:#8e44ad;transition:width .4s}
.stats div{display:flex;justify-content:space-between;align-items:center;padding:1px 0;border-bottom:1px solid var(--bd);position:relative}
.lb{cursor:help;text-decoration:underline dotted var(--mut);text-underline-offset:3px}
/* PANEL STATYSTYK (wariant E): nagłówki sekcji, kropki od nazwy do wartości, duże pogrubione liczby (zwykła czcionka gry) */
.stats .sth{display:flex;align-items:center;gap:8px;margin:4px 0 4px;font-size:11px;font-weight:800;line-height:1;letter-spacing:.12em;color:var(--ac)}
.stats .sth:before,.stats .sth:after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--ac))}.stats .sth:after{background:linear-gradient(90deg,var(--ac),transparent)}
.stats .sth+.sr{margin-top:2px}.stats .sr+.sth{margin-top:10px}
.stats div.sr{justify-content:flex-start;gap:6px;padding:3px 0;border-bottom:0;font-size:13px}
.stats .sdot{flex:1;align-self:flex-end;margin:0 4px 5px;border-bottom:2px dotted var(--bd)}
.stats .sv{font-size:16px;font-weight:800;line-height:1;color:var(--tx);white-space:nowrap}
.stats .sr.at .sv{color:var(--ac)}
.stats .plusw{margin-left:4px}
.stats .plus{width:20px;height:20px;font-size:14px;font-weight:900;border-radius:3px;background:#e8793a;color:#fff;border:2px solid #1a0e08;box-shadow:inset 0 2px 0 #ffb36b,inset 0 -3px 0 #a8461a;text-shadow:1px 1px 0 #6a2a0c}
.stats .plus:disabled{background:var(--card);color:var(--mut);border:2px dashed var(--bd);box-shadow:none;text-shadow:none}
.plusw{display:inline-flex;margin-left:8px}
.plusw:has(.plus:disabled){cursor:not-allowed}
.plus{width:22px;height:22px;padding:0;line-height:1;font-size:17px;font-weight:800;border-radius:6px;background:var(--ac);color:var(--on-ac);border:1px solid var(--ac);animation:pl 1.6s infinite}
.plus:disabled{background:var(--card);color:var(--mut);border:1px dashed var(--bd);animation:none;pointer-events:none}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
/* złoto i skill pointy: w karcie postaci, między ekwipunkiem a napisem Level / XP, po prawej; Skill Points w lewej kolumnie, Gold zawsze w prawej
   (te same szerokości kolumn co wcześniej w pasku na górze) */
.money{display:grid;grid-template-columns:repeat(2,minmax(64px,auto));justify-content:end;gap:6px;margin-top:8px}
.spbox{grid-row:1;grid-column:1;display:flex;justify-content:flex-end;padding:3px 8px;border:1px solid var(--c2);border-radius:8px;font-weight:700}.spbox b{color:var(--c2)}.spbox[hidden]{display:none}
.gold{grid-row:1;grid-column:2;display:flex;justify-content:flex-end;padding:3px 8px;border:1px solid #e69500;border-radius:8px;font-weight:700}.gold b{color:#e69500}
.tiles,.grid9{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.grid9{grid-template-columns:repeat(3,1fr);max-width:360px}
/* wybór lochu – lista (wariant G) */
.dlist{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);border-left:4px solid var(--dc);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
button.drow:hover{border-color:var(--dc)}
.drow.lck{opacity:.4;cursor:default}
.drow .dnm{flex:1;font-size:15px}.drow .dlv{width:120px;color:var(--mut)}.drow .dpg{width:54px}.drow .dst{width:92px;text-align:right}
.dpip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;background:var(--bd);box-shadow:inset 0 0 0 1px #0004}.dpip.on{background:var(--dc)}
.dpill{font-size:10px;font-weight:800;padding:1px 6px;border-radius:9px;letter-spacing:.05em}
.dpill.def{background:#2f4a22;color:#9fe07a}.dpill.rdy{background:#5a2a10;color:#ffb36b}.dpill.lck{background:#2a2520;color:#8f806e}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center;min-height:84px;border-radius:10px}
.tile small{color:var(--mut)}.tile.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.tile.lock{border:1px dashed var(--bd);opacity:.45;background:transparent}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
/* KAFELEK LOKACJI Z GRAFIKĄ KRAINY: cały krajobraz 128×64 w skali 1:1 (ostre piksele) u góry, nazwa pod nim na ciemnym pasku */
.tile.biome{background:var(--biome) center 2px/128px 64px no-repeat,#120e0a;image-rendering:pixelated;justify-content:flex-end;padding:0 4px 3px;overflow:hidden}
.tile.biome b{color:#f5ebdd;text-shadow:1px 1px 0 #000}
.tile.biome:hover:not(:disabled){filter:brightness(1.15)}
.fig{font-size:40px;line-height:1.1;transition:transform calc(.2s * var(--ftempo, 1));margin-bottom:5px}.fig.hit{transform:translateX(14px)}.fig.hit2{transform:translateX(-14px)}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.info{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--mut);margin:8px 0}.info b{color:var(--tx)}.info>div{flex:1 1 calc(50% - 6px)}.info>div>span{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd)}
/* łup z wyprawy nad przyciskiem Collect (po wygranej) */
/* bariera (Elemental Barrier): niebieska końcówka paska HP gracza, zaraz za czerwoną częścią */
/* PASEK HP W WALCE: pikselowy pasek – gruby czarny obrys, płaskie czerwone wypełnienie, ciemne tło pustej części, cień pod spodem.
   Dokładne HP (np. 812/1200 HP) tylko po najechaniu myszą (na telefonie: dotknięcie) – dymek pod paskiem (nie zasłania nazwy). */
.arena .bar{height:22px;margin-top:5px;border:4px solid #111;border-radius:0;background:#3b1012;box-shadow:0 4px 0 rgba(0,0,0,.28);overflow:hidden}
.arena .bar{position:relative}
.arena .bar i{position:relative;z-index:1;background:linear-gradient(#ff6b6b 0 25%,#e8212b 25% 70%,#a3121a 70%);box-shadow:none;transition:none}   /* pikselowe cieniowanie: jasny / czerwony / ciemny pas */
/* jasnoczerwony „ślad” zadanych obrażeń: czerwień spada od razu, ślad zostaje 0.2 s i potem płynnie zjeżdża ok. 0.25 s – ruch liczy pętla w ui.js (TRAIL_HOLD, TRAIL_TIME), także przy kolejnych ciosach */
.arena .bar i.hpg{position:absolute;left:0;top:0;z-index:0;background:#ffb0b3;box-shadow:none;transition:none}
.arena .bar #sh1{z-index:2}
/* PASEK UMIEJĘTNOŚCI gracza pod paskami HP: 10 kwadratowych slotów w jednym rzędzie na całą szerokość (na razie puste – miejsce na aktywne skille);
   ciemne wypełnienie (jak pasek akcji), w prawym dolnym rogu klawisz: 1 2 3 4 5 Q W E R Tab. */
.skillbar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin:18px 4px 0;padding:12px 16px;border-radius:12px;
  /* tło „Żelazo i ogień”: ciemna stalowa płyta (jaśniejsza góra, ciemniejszy dół), 4 nity w rogach, żarząca się pomarańczowa krawędź */
  background:radial-gradient(circle at 9px 9px,#8e8a99 0 3px,#111 3px 5px,transparent 5px),radial-gradient(circle at calc(100% - 9px) 9px,#8e8a99 0 3px,#111 3px 5px,transparent 5px),
    radial-gradient(circle at 9px calc(100% - 9px),#8e8a99 0 3px,#111 3px 5px,transparent 5px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#8e8a99 0 3px,#111 3px 5px,transparent 5px),
    linear-gradient(#3a3640 0 6px,#26232b 6px calc(100% - 6px),#17151b calc(100% - 6px));
  box-shadow:inset 0 0 14px 2px rgba(232,121,58,.55),0 0 0 4px #111,0 0 12px 3px rgba(232,121,58,.45),0 8px 0 rgba(0,0,0,.3)}
.sk{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:linear-gradient(#46505e,#2d3440);border:3px solid #111;border-radius:8px;box-shadow:inset 0 3px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.28);box-sizing:border-box}
.sk .kb{position:absolute;right:3px;bottom:2px;font-size:11px;font-weight:700;line-height:1;color:#f3e3c4;z-index:2;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}   /* czarny kontur – klawisz czytelny także na ikonie */
/* slot 1 = ATAK: duża ikona obecnej broni; w trakcie walki, gdy ruch ma przeciwnik, ikona jest wyszarzona (Twoja tura = pełne kolory) */
.sk.atk{cursor:pointer}.sk.atk .ic{font-size:40px}
.sk.atk img,.sk.atk .ic{transition:filter .12s,opacity .12s}
#skillbar.fighting .sk.atk:not(.ready) img,#skillbar.fighting .sk.atk:not(.ready) .ic{filter:grayscale(1);opacity:.35}
#skillbar.fighting .sk.atk:not(.ready){cursor:default}
/* ABILITIES na pasku: ikona, koszt Rage (lewy górny róg), licznik odnowienia; szare, gdy nie można użyć; przeciąganie między slotami */
.sk.ab{cursor:pointer}.sk.ab .ic{font-size:34px;line-height:1;transition:filter .12s,opacity .12s}
.sk.ab.off{cursor:default}.sk.ab.off .ic{filter:grayscale(1);opacity:.35}
.sk .abc{position:absolute;left:3px;top:2px;font-size:11px;font-weight:700;line-height:1;color:#ffb347;z-index:2;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000}
.sk .abcd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;z-index:3;pointer-events:none;text-shadow:2px 2px 0 #000}
.sk.abover{outline:3px solid #f07b16;outline-offset:1px}
.sk.ab.proc{animation:abproc .7s ease-in-out infinite alternate}   /* Revenge / Decapitate gotowe – pulsuje */
/* PASEK – wygląd (1+2): ikona wypełnia cały slot; klawisz na plakietce pod slotem; koszt Rage na plakietce w lewym górnym rogu
   (pomarańczowa = koszt, zielona = generuje Rage); niedostępne – przygaszone, ale kolorowe; odnowienie – ciemna nakładka z liczbą tur */
#skillbar{padding-bottom:20px}
#skillbar .sk{border:2px solid #000;background:#14161b}
#skillbar .sk.ab .ic.img{inset:0;border-radius:6px}
#skillbar .sk .kb{right:auto;left:50%;bottom:-11px;transform:translateX(-50%);background:#15131a;border:1px solid #4a4452;border-radius:4px;padding:2px 5px;font-size:10px;color:#d8cbb4;text-shadow:none}
#skillbar .sk .abc{left:-4px;top:-5px;background:#15131a;border:1px solid #f07b16;border-radius:4px;padding:2px 4px;font-size:10px;color:#ffb347;text-shadow:none}
#skillbar .sk .abc.gen{border-color:#3fbf4f;color:#7fe08a}
#skillbar .sk .abc,#skillbar .sk .kb{z-index:4}   /* plakietka kosztu i klawisza nad nakładką odnowienia */
#skillbar .sk .abc.norage,#skillbar .sk .abc.gen.norage{border-color:#4a4452;color:#7d7684}   /* za mało Rage na tę umiejętność – plakietka szara */
#skillbar .sk.ab.off .ic{filter:grayscale(.9) brightness(.45);opacity:1}
#skillbar .sk .abcd:not(:empty){background:rgba(0,0,0,.55);border-radius:6px;font-size:24px}
@keyframes abproc{from{box-shadow:0 0 0 2px #f07b16,0 0 6px #f07b16}to{box-shadow:0 0 0 3px #ffc06a,0 0 18px #f07b16}}
/* POZIOM UMIEJĘTNOŚCI: „lvl X” przy nazwie, pasek postępu użyć do następnego poziomu, napis LVL X! przy awansie */
.abpips{display:flex;gap:6px;margin:4px 0 8px 2px}
.abpips i{width:10px;height:10px;transform:rotate(45deg);background:#3a3126;border:1px solid #111}
.abpips i.on{background:#ff7a3d;box-shadow:0 0 4px #ff7a3d}
.abnext{margin-top:8px;font-size:12px;color:var(--mut);text-align:right}
.abedge{height:5px;margin:4px -12px -12px;background:#3a3126;border-radius:0 0 10px 10px;overflow:hidden}
.abedge i{display:block;height:100%;background:linear-gradient(90deg,#c0412f,#ff7a3d)}
.abedge.max i{background:linear-gradient(90deg,#c9961e,#ffd36b)}
.ablvup{position:fixed;transform:translate(-50%,-100%);z-index:60;font-size:18px;font-weight:900;color:#ffd36b;text-shadow:2px 2px 0 #000;pointer-events:none;animation:ablvup 1.4s ease-out forwards}
@keyframes ablvup{0%{opacity:0;margin-top:6px}15%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-26px}}
/* ZAKŁADKA ABILITIES */
.abgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.abcard{width:84px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.abtile{position:relative;width:74px;height:74px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#46505e,#2d3440);border:3px solid #111;border-radius:10px;box-shadow:0 0 0 2px #3a3027;cursor:help;transition:transform .12s,box-shadow .12s}
.abtile:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #f07b16,0 0 12px #f07b1666}
.abcard.has .abtile{box-shadow:0 0 0 2px #f07b16}
.abti{font-size:38px;line-height:1}
/* IKONY UMIEJĘTNOŚCI (pixel art 32×32, plik 128 px): wypełniają kafelek / slot */
.abti.img,.sk.ab .ic.img{position:absolute;inset:3px;border-radius:6px;overflow:hidden;font-size:0}.abti.img img,.sk.ab .ic.img img{display:block;width:100%;height:100%;image-rendering:pixelated}
.abcard.lock .abti{filter:grayscale(1);opacity:.35}
.ablock{position:absolute;left:0;right:0;bottom:4px;font-size:10px;font-weight:800;color:#f0e6d2;text-shadow:1px 1px 0 #000}
.abnm{font-size:11px;line-height:1.2;margin-top:3px}
.abcard .abpips{margin:0;justify-content:center}
.ablvl{display:block;margin:2px 0 6px;font-size:12px;font-weight:700;color:#ff7a3d}.abcard .ablvl{margin:0}
.abtrain{width:100%;padding:3px 0;font-size:12px;font-weight:700}
.abtrain:not(:disabled){background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.abds{font-size:11px;line-height:1.35;color:var(--mut)}
.abok{font-size:12px;font-weight:700;color:#f07b16}
/* ULTIMATE: osobna grupa ze złotą ramką; wybrany = złoto, pozostałe „Not chosen” */
/* zwykłe umiejętności: kafelki rozciągnięte na całą szerokość (kwadratowe); grupa ULTIMATE wyśrodkowana */
.abgrid.abmain{flex-wrap:nowrap;gap:12px}
.abmain .abcard{flex:1 1 0;min-width:0;width:auto}
.abmain .abtile{width:100%;height:auto;aspect-ratio:1}
.abmain .abti{font-size:56px}
.abultg{margin-top:18px}
.abulth{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:var(--mut);font-size:15px;font-weight:800;letter-spacing:.14em;white-space:nowrap}
.abulth:before,.abulth:after{content:'';flex:1;height:1px;background:var(--bd)}
.abgrid.abultrow{padding:0 12.5%}
/* ULTIMATE: rozżarzona ramka (złoto → pomarańcz → czerwień); wybrany ult pulsuje (złota nazwa – w dymku); niewybrane – szara ramka */
.abultrow .abtile{border:3px solid transparent;background:linear-gradient(#2d3440,#2d3440) padding-box,linear-gradient(135deg,#ffd36b,#e8793a 40%,#d94b4b 70%,#6e1420) border-box;box-shadow:0 0 0 2px #111}
.abultrow .abcard.has .abtile{box-shadow:0 0 0 2px #111,0 0 18px #e8793acc;animation:ultglow 1.4s ease-in-out infinite alternate}
@keyframes ultglow{to{box-shadow:0 0 0 2px #111,0 0 26px #ffb347}}
.abultrow .abcard.lock .abtile{background:linear-gradient(#2d3440,#2d3440) padding-box,linear-gradient(135deg,#6a6070,#3a3440) border-box}
.abmorphg{margin-top:18px}
.abmorphg .abgrid{flex-wrap:nowrap;align-items:center;gap:14px;padding:0 27%}
.abmorphg .abcard{flex:1 1 0;width:auto;min-width:0}.abmorphg .abtile{width:100%;height:auto;aspect-ratio:1}.abmorphg .abti{font-size:56px}
.abmorphg .abtrain{margin-top:2px}
.abor{font-size:14px;font-weight:800;color:var(--mut)}
.abmcancel{display:block;margin:10px auto 0;background:none;border:0;padding:2px 6px;color:var(--mut);font-size:12px;text-decoration:underline;cursor:pointer}.abmcancel:hover{color:var(--tx)}
.abtrain.abmorph{text-transform:uppercase;letter-spacing:.06em}
.abultl{display:block;margin-bottom:8px;font-size:11px;font-weight:800;letter-spacing:.12em;color:#ffd36b}

.abnot{font-size:11px;color:#6f604f}
/* MORPH: przycisk po 5 poziomie umiejętności i wybór jednego z dwóch wariantów (OR między nimi) */
/* LICZNIK POSTĘPU UMIEJĘTNOŚCI: kolumna po lewej od gry (poza siatką .wrap); ikona, „Lv N”, pasek – jeden kolor; chowa się, gdy brak miejsca */
#xp-side{position:absolute;right:100%;top:10px;margin-right:34px;width:200px;display:flex;flex-direction:column;gap:12px}
#xp-side[hidden]{display:none}
#xp-side .xpr{display:flex;align-items:center;gap:10px}
#xp-side .xpi{position:relative;flex:none;width:44px;height:44px;border:2px solid #000;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;background:#14161b}
#xp-side .xpi.img img{display:block;width:100%;height:100%;image-rendering:pixelated}
#xp-side .xpt{flex:1;min-width:0}#xp-side .xpt b{display:block;margin-bottom:4px;font-size:12px;font-weight:700;color:var(--tx)}
#xp-side .xpb{height:10px;background:#15131a;border:2px solid #000;border-radius:3px;overflow:hidden}#xp-side .xpb i{display:block;height:100%;background:#e8793a;box-shadow:inset 0 2px 0 #ffb36b}
@media(max-width:1580px){#xp-side{width:calc((100vw - 1120px) / 2 - 48px)}}
#xp-side .xpup,#xp-side .xpup0{flex:none;width:22px;height:22px;margin-top:16px}
#xp-side .xpup{padding:0;background:#e8793a;color:#fff;border:2px solid #1a0e08;border-radius:3px;font:800 16px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:inset 0 2px 0 #ffb36b,inset 0 -3px 0 #a8461a;text-shadow:1px 1px 0 #6a2a0c;display:flex;align-items:center;justify-content:center;animation:xpupglow 1s ease-in-out infinite alternate}
#xp-side .xpup:hover:not(:disabled){background:#f08a4a}
#xp-side .xpup:disabled{background:#8a8090;box-shadow:inset 0 2px 0 #b0a8b6,inset 0 -3px 0 #5a5260;text-shadow:none;cursor:not-allowed;animation:none}
@keyframes xpupglow{from{filter:none}to{filter:drop-shadow(0 0 5px #f0a040)}}
@media(max-width:1380px){#xp-side{display:none}}
/* PRZYCISKI AKCJI – wariant B (Pixel 3D): pomarańczowa twarz, jasna krawędź u góry, gruby ciemny cień u dołu, czarna obwódka; po kliknięciu wciśnięty.
   Dotyczy: Train / Choose (Abilities), Fight! (lochy), Fight! / Skip / Collect (#go), Back (#fbackrow, .bkac), Accept (#clsok); MORPH – wersja fioletowa.
   „body” w selektorze – wygrywa ze stylami wstawianymi przez ui.js */
body :is(.abtrain:not(:disabled),#fbackrow button,#go,.dfbtn,.bkac,#clsok){background:#e8793a;color:#fff;border:2px solid #1a0e08;border-radius:3px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  box-shadow:inset 0 2px 0 #ffb36b,inset 0 -4px 0 #a8461a;text-shadow:1px 1px 0 #6a2a0c;padding-bottom:7px}
body :is(.abtrain:not(:disabled),#fbackrow button,#go,.dfbtn,.bkac,#clsok):hover:not(:disabled){background:#f08a4a;border-color:#1a0e08}
body :is(.abtrain:not(:disabled),#fbackrow button,#go,.dfbtn,.bkac,#clsok):active:not(:disabled){box-shadow:inset 0 2px 0 #a8461a;padding-top:7px;padding-bottom:5px}
body :is(.abtrain,#go,.dfbtn,#clsok):disabled{opacity:1;background:#8a8090;color:#d8d2dc;border:2px solid #1a0e08;border-radius:3px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;box-shadow:inset 0 2px 0 #aaa2b0,inset 0 -4px 0 #5e5664;text-shadow:none;padding-bottom:7px}
/* ABILITIES: podzakładki Abilities | Battle Plan */
.absubs{display:flex;gap:6px;margin-bottom:12px}
.absub{padding:5px 12px;border:1px solid var(--bd);border-radius:8px;font:inherit;font-weight:700;font-size:12px;color:var(--mut);background:transparent;cursor:pointer;text-transform:uppercase}
.absub:hover{color:var(--tx)}
.absub.on{background:#e8793a;color:#fff;border:2px solid #1a0e08;border-radius:3px;box-shadow:inset 0 2px 0 #ffb36b,inset 0 -4px 0 #a8461a;text-shadow:1px 1px 0 #6a2a0c;padding:4px 12px 6px}
/* BATTLE PLAN: ścieżka kart (od lewej), okienko warunków pod kartami */
.bpflow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 4px;padding:8px 0 0 6px}
.bpc{width:92px;background:#211b14;border:1px solid var(--bd);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer;user-select:none}
.bpc:hover{border-color:#8a6a44}
.bpc.sel{border-color:#e8793a;box-shadow:0 0 0 1px #e8793a}
.bpc.drag{opacity:.4}.bpc.over{border-color:#ffb347;border-style:dashed}
.bpc.off{opacity:.45}
.bpc b{font-size:11px;text-align:center;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.bpn{position:absolute;left:-7px;top:-9px;width:22px;height:22px;border-radius:50%;background:#e8793a;border:2px solid #1a0e08;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}
.bpi{width:52px;height:52px;border:2px solid #000;border-radius:6px;background:#14161b;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex:none}
.bpi.img img{display:block;width:100%;height:100%;image-rendering:pixelated}
.bpdot{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#e8793a;border:1px solid #111}.bpdot.skip{background:#7a6a55}
.bpa{color:#e8793a;font-size:22px;margin-top:30px;width:12px;text-align:center}
.bpc.ult{border-color:#a8461a;background:linear-gradient(#2a1a10,#211b14)}
.bpc.atk{opacity:.7;cursor:default}.bpc.atk .bpn{background:#4a4452}
.bpop{position:relative;margin-top:18px;max-width:600px;background:#17130e;border:2px solid #e8793a;border-radius:8px;padding:12px 14px;display:flex;gap:14px;font-size:12px;color:#f0e6d2}
.bpop:before{content:'';position:absolute;top:-10px;left:var(--ax,40px);border:8px solid transparent;border-bottom-color:#e8793a;border-top:0}
.bplf{width:90px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border-right:1px solid #2e261c;padding-right:14px}
.bplf b{font-size:11px;color:#fff;line-height:1.2}
.bpoff{background:transparent;border:1px solid #5a2a2a;border-radius:4px;color:#d97070;font:inherit;font-size:10px;padding:3px 7px;cursor:pointer}.bpoff:hover{border-color:#d94b4b;color:#ff8a7a}
.bpoff.on{background:#d94b4b;border:2px solid #1a0e08;color:#fff;font-weight:800;box-shadow:inset 0 2px 0 #ff8a7a,inset 0 -3px 0 #8a2020;padding:2px 6px}
.bprt{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:2px}
.bpq{font-size:11px;color:#8a7a62}
.bppl{display:flex;flex-wrap:wrap;gap:5px}.bppl span{padding:4px 10px;border:1px solid #4a3e2c;border-radius:99px;font-size:11px;color:#b8ab92;background:#211b14;cursor:pointer;white-space:nowrap}
.bppl span:hover{color:var(--tx);border-color:#8a6a44}.bppl span.on{background:#e8793a;border-color:#e8793a;color:#fff;font-weight:800}
.bpck{display:flex;align-items:center;gap:8px;color:#b8ab92;cursor:pointer}.bpck:hover{color:var(--tx)}.bpck.on{color:#fff}.bpck i{font-style:normal;color:#7a6a55}
.bpck input{appearance:none;-webkit-appearance:none;margin:0;width:14px;height:14px;flex:none;border:2px solid #7a6a55;border-radius:3px;background:#0f0d0a;cursor:pointer;display:grid;place-content:center}
.bpck input:checked{background:#e8793a;border-color:#e8793a}.bpck input:checked:after{content:'';width:3px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.bpreset{display:block;margin-top:14px;background:transparent;border:1px solid var(--bd);border-radius:6px;color:var(--mut);font:inherit;font-size:11px;padding:3px 10px;cursor:pointer}.bpreset:hover{color:var(--tx)}
/* ULTIMATE użyty (do końca walki): ikona mocno wyszarzona + nałożona kłódka z łańcuchami; bez napisu i bez kosztu */
#skillbar .sk .abcd.used{font-size:0;background:url(assets/ui/ui_ult_used.png) center/32px 32px no-repeat,rgba(0,0,0,.35);image-rendering:pixelated}   /* 32 px = pełne piksele grafiki (bez nierównego skalowania) */
#skillbar .sk:has(.abcd.used) .ic{filter:grayscale(1) brightness(.3)!important}
#skillbar .sk:has(.abcd.used) .abc{display:none}
/* ZAKŁADKA SETTINGS */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.setrow small{color:var(--mut);display:block;margin-top:2px}
.setopt{display:flex;gap:6px}.setopt button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:700}
/* procent HP na środku paska */
.arena .bar .hpp{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;line-height:1;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;pointer-events:none}
.hpw{position:relative;outline:none;cursor:default}
/* dokładne HP przy lewej krawędzi paska (np. 150/240); procent dalej na środku */
body.hpv-off .arena .bar .hpv{display:none}   /* Settings: tylko procenty */
.arena .bar .hpv{position:absolute;left:6px;top:0;bottom:0;z-index:3;display:flex;align-items:center;font-size:11px;font-weight:700;line-height:1;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;pointer-events:none}
/* RAGE: pomarańczowy pasek pod zdrowiem bohatera, 0–100; każdy zwykły atak +8 (liczba na środku) */
.arena .bar.rage{height:18px;margin-top:4px;background:#2e1806}
.arena .bar.rage i{background:linear-gradient(#ffc06a 0 25%,#f07b16 25% 70%,#a84a08 70%);transition:width .25s}
.arena .bar.rage .hpp{font-size:11px}
.hptip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-weight:700;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hptip:empty{display:none}.hptip::after{content:" HP"}
.hpw:hover .hptip,.hpw:focus .hptip{opacity:1}
#sh1{position:absolute;top:0;left:100%;width:0;height:100%;background:#3a8fd6;transition:left .3s,width .3s}
#loot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:26px 0 10px}   /* łup niżej – z odstępem od paska umiejętności */#loot[hidden]{display:none}
#loot .cell{width:56px;height:56px;flex:none}#loot small{color:var(--mut)}
/* nagroda nad łupem: +XP (fiolet jak pasek XP) i +złoto z monetą */
#loot .rw{flex-basis:100%;display:flex;justify-content:center;gap:16px;font-weight:700;font-size:15px}
/* Back w oknie walki (wyprawa): ten sam kolor co Fight! */
#fbackrow button{background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:700}
/* wynik walki w miejscu Back (po walce): Victory! zielone / Defeat czerwone; stała wysokość wiersza – okno nie skacze */
#fbackrow{height:32px;position:relative}#fres{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;text-align:center;font-size:20px;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;gap:4px}   /* wynik na środku okna walki – nakładka: nie zmienia wysokości okna */
/* WYNIK WALKI: duży napis z ciemnym cieniem + mały podpis z rozstrzelonymi literami */
/* LOCH: napis VICTORY / DEFEAT nad oknem walki (jak na wyprawie) – nakładka, nie zmienia wysokości karty */
#body-dun{position:relative}.dres{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.resv{font-size:32px;font-weight:800;line-height:1;letter-spacing:.06em;text-shadow:3px 3px 0 #000}
.resv.win{color:#f5d88a}.resv.lose{color:#e05050}
.ress{font-size:11px;font-weight:700;letter-spacing:.25em;color:var(--mut)}
:root:not([data-theme=dark]) .resv.win{color:#e8b54a}
#gorow{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px}#gorow #go{margin:0}#series{display:flex;gap:6px}#series[hidden]{display:none}#series button{min-width:44px;padding:3px 8px;font-weight:800}#series button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}#series .serp{font-weight:800;color:var(--ac)}   /* BATTLE SERIES: 2x / 3x / 4x obok Auto (w jednym wierszu z #go) */
#go{display:block;width:auto;margin:20px auto 0;padding:6px 16px;background:var(--ac);color:var(--on-ac);border-color:var(--ac);font-weight:700}
/* DPS METER: średnie obrażenia na Twoją turę; dymek = obrażenia z każdego źródła */
/* odznaka: ikonka wykresu + liczba + „dmg / turn”; po najechaniu podnosi się i świeci (zaprasza do sprawdzenia szczegółów) */
/* DPS METER: sama liczba w ramce ze smokami (bez napisu DMG / TURN) */
/* DPS METER: ramka ze smokami (assets/ui/ui_dps_frame.png, 59×30 pokazana ×2) + liczba zwykłą czcionką gry, pogrubiona */
#tip:has(.dpst){max-width:none}
.dpst{display:flex;flex-direction:column;gap:3px;width:380px;margin-top:4px;font-size:14px}
.dprow{display:flex;align-items:center;gap:6px}
.dpi{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;background:#111;border:1px solid #444;border-radius:3px;overflow:hidden}
.dpi img{width:20px!important;height:20px!important;image-rendering:pixelated}
.dpbar{position:relative;flex:1;height:22px;background:#1a1612;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 6px;box-sizing:border-box}
.dpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#c0412f,#7d2418);z-index:0}
.dpn,.dpv{position:relative;z-index:1;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap}.dpv{font-weight:700;margin-left:10px}
.dptot{margin-top:4px;font-size:13px;color:var(--mut)}
.dpstot{font-size:18px;font-weight:800;letter-spacing:0;color:#e8793a;text-transform:none}.dpstot small{font-size:12px;color:var(--mut);margin-left:2px}   /* panel DPS: łączne obrażenia na turę (prawy górny róg) */
#log[hidden]{display:none}   /* log walki ukryty, dopóki gracz nie kliknie „Show battle log” */
#log{height:100px;overflow:auto;font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:5px;margin:8px 0}
#log p{margin:1px 0}.crit{color:var(--ac);font-weight:700}.miss{color:var(--mut)}
.cell{position:relative}.qty{position:absolute;right:3px;bottom:0;font-size:11px;font-weight:700;color:var(--tx);text-shadow:0 0 3px var(--card),0 0 3px var(--card)}
.cell.new{position:relative}
.cell.new::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e53935;box-shadow:0 0 5px 2px #e5393588;animation:newglow .9s infinite alternate;pointer-events:none}
@keyframes newglow{from{opacity:.55;box-shadow:0 0 3px 1px #e5393577}to{opacity:1;box-shadow:0 0 9px 4px #e53935aa}}
.px.rust{filter:sepia(.8) saturate(.6) brightness(.7)}
/* miecz w slocie broni ekwipunku: 64 px (siatka 32×32 → dokładnie ×2, ostre piksele) */
.slot[data-slot=weapon] img[src*="/weapon/"]{width:64px!important;height:64px!important;image-rendering:pixelated!important}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--card)}.cell .ic{font-size:32px}.cell.r0{border-color:var(--c0)}.cell.r1{border-color:var(--c1)}.cell.r2{border-color:var(--c2)}.cell.r3{border-color:var(--c3)}.cell.r4{border-color:#f2c200;box-shadow:0 0 8px #f2c20088}.cell.r5{border-color:#e53935;box-shadow:0 0 8px #e5393588}
#sellbtn.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
#tip{position:fixed;display:none;z-index:50;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:18px;line-height:1.35;max-width:315px;pointer-events:none;box-shadow:0 4px 14px #0006}
#tip b{display:block;font-size:19px}
/* dymek umiejętności: koszt Rage i odnowienie w prawym górnym rogu, obok nazwy */
#tip .tiph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
#tip .tiph .ablvl{margin:2px 0 0}
#tip .tipc{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right;font-size:12px;line-height:1.3;color:var(--mut);white-space:nowrap}
#tip .tipc em{font-style:normal;font-size:14px;color:#ffb347}#tip .tipc em.gen{color:#7fe08a}
#skillreset:disabled{pointer-events:none}#skillresetw:has(#skillreset:disabled){cursor:not-allowed}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,90px);gap:16px 12px}
.recipe{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:90px}
.ctabs{display:flex;gap:6px;margin-bottom:10px}.ctabs button{font-weight:700}.ctabs button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
#devbtn{position:fixed;left:12px;bottom:12px;z-index:60;font-weight:700;font-size:12px;opacity:.85}
#devbtn.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}

/* WYBÓR RYBY (boczne menu łowienia) */
.fish-list{display:flex;flex-direction:column;gap:10px}
.fish-row{display:flex;align-items:center;gap:10px}
.fish-row .cell{width:54px;height:54px;flex:none}
.fish-row .cell.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),0 0 10px color-mix(in srgb,var(--ac) 60%,transparent)}
.fish-row .cell.lock{border-style:dashed;opacity:.5;cursor:not-allowed;background:transparent}
.fish-row small{color:var(--mut)}

#popup-container {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 100;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.popup-msg {
  background: color-mix(in srgb, var(--ac) 15%, var(--card));
  border: 2px solid var(--ac);
  border-radius: 10px;
  padding: 12px 16px;
  box-shadow: 0 4px 16px #0005;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  animation: fadeIn .3s ease-out;
}
.popup-msg button {
  background: var(--ac);
  color: #fff;
  border: none;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

/* DRZEWKO ULEPSZEŃ */
.upg-tree-container{position:relative;width:100%;height:380px;background:color-mix(in srgb,var(--bd) 10%,transparent);border-radius:10px;border:1px solid var(--bd);overflow:hidden;cursor:grab}
.upg-tree-container:active{cursor:grabbing}
.upg-tree-content{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:center center;transition:transform 0.05s ease-out}
.upg-svg-lines{position:absolute;top:0;left:0;width:100%;height:100%}
.upg-line{stroke:var(--bd);stroke-width:2.5}
.upg-node{position:absolute;width:48px;height:48px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid var(--bd);background:var(--card);box-shadow:0 2px 6px #0002;transition:transform .1s;cursor:pointer;user-select:none}
.upg-node:hover:not(.disabled):not(.bought){border-color:var(--ac);transform:translate(-50%,-50%) scale(1.1)}
.upg-node.disabled{opacity:.4;cursor:not-allowed;background:transparent;border-style:dashed}
.upg-node.bought{border-color:#f2c200;background:color-mix(in srgb,#f2c200 22%,var(--card));box-shadow:0 0 12px 3px #f2c200aa;cursor:default}
.upg-node.center-node{width:56px;height:56px}
.upg-node .ic{font-size:24px;line-height:1}
.upg-node.small{width:24px;height:24px;border-radius:6px}.upg-node.small::before{content:'';position:absolute;inset:-9px}   /* większy obszar najechania / kliknięcia małego noda (wygląd bez zmian) */.upg-node.small .ic{font-size:12px}
.upg-node.avail{border-color:var(--ac);box-shadow:0 0 9px color-mix(in srgb,var(--ac) 55%,transparent)}
.upg-line.on{stroke:#f2c200;filter:drop-shadow(0 0 3px #f2c200)}.upg-line.off{stroke-dasharray:4 5;opacity:.75}
.upg-badge{position:absolute;bottom:-4px;right:-4px;background:var(--ac);color:var(--on-ac);font-size:9px;font-weight:700;padding:1px 4px;border-radius:6px;border:1px solid var(--card)}
.upg-node.bought .upg-badge{background:#f2c200;color:#2b2118}

.tiles.mobt{row-gap:30px;margin-top:26px}

.mbq.mbx.on{background:#33194d;box-shadow:inset 0 0 0 1px #8c54d4,0 0 6px #8c54d499}   /* jak Gold: ciemne tło, kolorowa obwódka i poświata */
.mbq.mbg.on{background:#5a3a10;box-shadow:inset 0 0 0 1px #e69500,0 0 6px #e6950099}
.tile.mlock .mbon{opacity:.5}
.mbq .xporb{width:10px;height:10px;box-shadow:0 0 4px 1px #8c54d4aa}.mbq img{vertical-align:0!important}
.mbq:not(.on)>*{filter:grayscale(1) brightness(.7);opacity:.6}   /* zablokowany: ikona wyszarzona */
/* LISTA DROPÓW: ikona skrzyni w prawym górnym rogu okna walki (wiersz Back), dymek z dropami przeciwnika */
#dropbtn,#infobtn{position:absolute;top:2px;right:12px;z-index:6;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:help}
#infobtn{right:54px}#infobtn.solo{right:12px}#infobtn.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 35%,var(--card))}   /* „i” jak zakładki w Fishing; w lochu (bez listy dropów) w samym rogu */
#dropbtn[hidden]{display:none}#dropbtn:hover,#infobtn:hover{border-color:var(--ac)}
#dropbtn img{width:32px;height:32px;image-rendering:pixelated;display:block}
#tip .etpic{display:flex;justify-content:center;padding:6px;background:#14161b;border:2px solid #000;border-radius:6px}#tip .etpic img,#tip .etpic .ic{width:96px!important;height:96px!important;image-rendering:pixelated}
#tip .ethead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:8px 0 4px}#tip .ethead b{display:inline;font-size:18px}#tip .ethead .mlvl{position:static;font-size:13px}
#tip .etrow{display:flex;justify-content:space-between;gap:20px;padding:3px 0;border-bottom:1px dotted var(--bd);font-size:15px}#tip .etrow:last-child{border:0}#tip .etrow span{color:var(--mut)}#tip .etrow b{display:inline;font-size:15px}   /* dymek „i”: karta przeciwnika */
#tip .drrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:15px}#tip .drrow em{margin-left:auto;padding-left:14px;font-style:normal;font-weight:800}#tip .drrow img{width:32px!important;height:32px!important}
.tile.boss{border-color:#e0524a;box-shadow:0 0 10px 2px color-mix(in srgb,#e0524a 45%,transparent)}.fig.boss{filter:drop-shadow(0 0 7px #e0524a)}

<script type="module">
  // Szuka ui.js obok index.html oraz w typowych podfolderach i podaje w konsoli, co znalazł.
  const candidates = ['./ui.js', './js/ui.js', './src/ui.js', './scripts/ui.js', './javascript/ui.js'];
  let found = null;
  for (const p of candidates) {
    try { const r = await fetch(p, { method: 'HEAD' }); if (r.ok) { found = p; break; } } catch (e) { /* próbuj dalej */ }
  }
  if (!found) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="padding:12px;background:#e53935;color:#fff;font:14px monospace">ui.js not found (checked: ' + candidates.join(', ') + '). Set the path in index.html.</div>');
    console.error('ui.js not found in:', candidates);
  } else {
    console.log('Loading game from', found);
    await import(found);
  }
</script></body></html>
